services:
  postgres-db:
    image: postgres:15-alpine
    container_name: miayam-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miayam}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miayam"]
      interval: 5s
      timeout: 5s
      retries: 5

  miayam-api:
    build: .
    container_name: miayam-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-miayam}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASS=${POSTGRES_PASSWORD:-postgres}
      - API_KEY=${API_KEY:-my-secret-api-key}
      - API_SECRET=${API_SECRET:-my-secret-signature-key}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
